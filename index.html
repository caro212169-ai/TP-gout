<title>Goût, eau et sel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Layout : appli mobile type « parcours » ; barre de stats en haut, navigation en bas, leçons plein écran */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --ink:#3C3C3C; --muted:#777777; --line:#E5E5E5; --sunk:#F7F7F7;
  --green:#58CC02; --green-d:#46A302; --green-soft:#D7FFB8; --green-ink:#58A700;
  --blue:#1CB0F6; --blue-d:#1899D6; --blue-soft:#DDF4FF; --blue-ink:#1899D6;
  --red:#FF4B4B; --red-d:#EA2B2B; --red-soft:#FFDFE0; --red-ink:#EA2B2B;
  --orange:#FF9600; --orange-d:#E08600; --orange-soft:#FFF0D9;
  --purple:#CE82FF; --purple-d:#A568CC; --purple-soft:#F4E5FF;
  --pink:#FF86D0; --pink-d:#E070B5; --yellow:#FFC800; --yellow-d:#E5A900; --yellow-soft:#FFF5D1;
  --font:"Nunito",ui-rounded,"Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131F24;--surface:#131F24;--ink:#F1F7FB;--muted:#93A8B3;--line:#37464F;--sunk:#1B2B32;
  --green-soft:#1F3A12;--green-ink:#79D634;--blue-soft:#12324A;--blue-ink:#49C0F8;--red-soft:#3D1E22;--red-ink:#FF7878;
  --orange-soft:#3B2A12;--purple-soft:#2F2140;--yellow-soft:#3A3212;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131F24;--surface:#131F24;--ink:#F1F7FB;--muted:#93A8B3;--line:#37464F;--sunk:#1B2B32;
  --green-soft:#1F3A12;--green-ink:#79D634;--blue-soft:#12324A;--blue-ink:#49C0F8;--red-soft:#3D1E22;--red-ink:#FF7878;
  --orange-soft:#3B2A12;--purple-soft:#2F2140;--yellow-soft:#3A3212;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.45;font-weight:600}
button{font-family:var(--font)}
h1,h2,h3{margin:0;font-weight:900;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:.85rem}
.wrap{max-width:600px;margin:0 auto;padding-block:0 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Barre du haut */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);border-bottom:2px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;margin-bottom:16px}
.stat{display:flex;align-items:center;gap:5px;font-weight:900;font-size:1.05rem;font-variant-numeric:tabular-nums;background:none;border:0;color:inherit;cursor:pointer;padding:4px}
.stat svg{width:26px;height:26px}
.s-fire{color:var(--orange)} .s-fire.off{color:var(--muted)} .s-gem{color:var(--blue)} .s-star{color:var(--green)} .s-xp{color:var(--yellow-d)}

/* Navigation du bas */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--bg);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.bottom .in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:6px 0}
.bottom button{background:none;border:2px solid transparent;border-radius:14px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-weight:800;font-size:.7rem;text-transform:uppercase;letter-spacing:.03em;cursor:pointer}
.bottom button svg{width:28px;height:28px}
.bottom button[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft);color:var(--blue-ink)}

/* Boutons 3D */
.b3{--c:var(--green);--cd:var(--green-d);background:var(--c);color:#fff;border:0;border-bottom:4px solid var(--cd);border-radius:16px;font-weight:900;font-size:1rem;text-transform:uppercase;letter-spacing:.05em;padding:13px 18px;cursor:pointer;width:100%;transition:transform .05s}
.b3:active{transform:translateY(2px);border-bottom-width:2px}
.b3[disabled]{--c:var(--line);--cd:var(--line);color:var(--muted);cursor:default}
.b3.blue{--c:var(--blue);--cd:var(--blue-d)} .b3.red{--c:var(--red);--cd:var(--red-d)} .b3.orange{--c:var(--orange);--cd:var(--orange-d)} .b3.purple{--c:var(--purple);--cd:var(--purple-d)}
.b3.ghost{background:var(--surface);color:var(--blue-ink);border:2px solid var(--line);border-bottom-width:4px}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* Parcours */
.unit{border-radius:16px;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;margin:22px 0 10px;border-bottom:4px solid rgba(0,0,0,.18)}
.unit small{display:block;font-weight:800;opacity:.9;text-transform:uppercase;letter-spacing:.06em;font-size:.75rem}
.unit h2{font-size:1.2rem}
.unit .mini{width:52px;height:52px;flex:0 0 auto}
.path{display:flex;flex-direction:column;align-items:center;gap:18px;padding:54px 0 4px;position:relative}
.node{position:relative;width:72px;height:66px;border-radius:50%;border:0;cursor:pointer;background:var(--c,var(--line));box-shadow:0 7px 0 var(--cd,#C8C8C8);display:grid;place-items:center;color:#fff;transition:transform .08s}
.node svg{width:34px;height:34px}
.node:active{transform:translateY(4px);box-shadow:0 3px 0 var(--cd)}
.node.locked{--c:var(--line);--cd:#CFCFCF;color:#AFAFAF;cursor:pointer}
:root[data-theme="dark"] .node.locked{--cd:#2A363C}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .node.locked{--cd:#2A363C}}
.node.gold{--c:var(--yellow);--cd:var(--yellow-d)}
.node.trophy{width:84px;height:76px}
.ringwrap{position:relative;display:grid;place-items:center}
.ringwrap svg.ring{position:absolute;width:98px;height:98px;top:50%;left:50%;transform:translate(-50%,-46%) rotate(-90deg)}
.bubble{position:absolute;bottom:calc(100% + 16px);left:50%;transform:translateX(-50%);background:var(--surface);border:2px solid var(--line);color:var(--c2,var(--green-ink));font-weight:900;text-transform:uppercase;font-size:.85rem;letter-spacing:.05em;padding:8px 14px;border-radius:12px;white-space:nowrap;animation:bob 1.6s ease-in-out infinite}
.bubble::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);border:8px solid transparent;border-top-color:var(--line)}
@keyframes bob{50%{transform:translate(-50%,-5px)}}
.side-m{position:absolute;width:96px}

/* Cartes et listes */
.panel{border:2px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;margin-bottom:14px}
.panel h2{font-size:1.2rem}
.tile{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:12px;background:var(--surface);cursor:pointer;color:inherit;text-align:left;width:100%}
.tile .ic{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;color:#fff}
.tile .ic svg{width:32px;height:32px}
.tile b{display:block;font-size:1.05rem;font-weight:900}
.tile span{color:var(--muted);font-size:.88rem}
.tiles{display:flex;flex-direction:column;gap:10px}
.qbar{height:16px;background:var(--line);border-radius:99px;overflow:hidden;position:relative}
.qbar i{display:block;height:100%;background:var(--yellow);border-radius:99px}
.qbar span{position:absolute;inset:0;display:grid;place-items:center;font-size:.72rem;font-weight:900;color:var(--ink)}
.quest{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:12px;align-items:center;padding:6px 0}
.quest b{display:block;margin-bottom:6px}
.chest{width:44px;height:44px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-weight:800;font-size:.85rem;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:5px 11px;cursor:pointer;min-width:38px}
.chip[aria-pressed="true"]{background:var(--blue-soft);border-color:var(--blue);color:var(--blue-ink)}
.big{font-size:3rem;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.ladder{display:flex;flex-direction:column;gap:6px}
.rung{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 12px;border-radius:14px;border:2px solid var(--line)}
.rung.on{background:var(--green-soft);border-color:var(--green)} .rung.cur{background:var(--yellow-soft);border-color:var(--yellow)}
.rung i{font-style:normal;font-weight:900;text-align:center}
.letters{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.lt{border:2px solid var(--line);border-radius:12px;padding:6px;text-align:center;position:relative;overflow:hidden}
.lt .f{position:absolute;left:0;right:0;bottom:0;background:var(--green-soft)}
.lt b{position:relative;font-size:.95rem;display:block;font-weight:900}
.lt small{position:relative;font-variant-numeric:tabular-nums;color:var(--muted)}
.lt.full{border-color:var(--green)} .lt.full b{color:var(--green-ink)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.bd{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
.bd .medal{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--muted);border-bottom:4px solid rgba(0,0,0,.15)}
.bd .medal svg{width:30px;height:30px}
.bd.on .medal{background:var(--c);color:#fff}
.bd b{font-size:.82rem;line-height:1.15} .bd small{font-size:.72rem;color:var(--muted);line-height:1.2}
.bd:not(.on){opacity:.6}
.wl .wi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:8px 2px;border-bottom:2px solid var(--line);align-items:center}
.wl small{color:var(--muted)}
.pill{border-radius:99px;padding:2px 10px;font-size:.72rem;font-weight:900;text-transform:uppercase;letter-spacing:.03em}
.p0{background:var(--line);color:var(--muted)} .p1{background:var(--red-soft);color:var(--red-ink)} .p2,.p3{background:var(--orange-soft);color:var(--orange-d)} .p4,.p5{background:var(--green-soft);color:var(--green-ink)}
.fam p.tip{background:var(--yellow-soft);border-radius:12px;padding:10px 12px;font-size:.95rem}
.fam dl{margin:0;display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr);gap:8px 12px}
.fam dt{font-weight:900} .fam dd{margin:0;color:var(--muted);font-size:.95rem}
.fam.hide dd{color:transparent;background:var(--line);border-radius:8px;cursor:pointer}
.fam.hide dd *{visibility:hidden}
@media (max-width:420px){.fam dl{grid-template-columns:1fr}.fam dd{margin-bottom:6px}}
ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:8px}
.week{display:grid;grid-template-columns:100px minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:2px solid var(--line)}
.week .d{font-weight:900;color:var(--blue-ink)}
.week.now .d{color:var(--green-ink)}
.linkbtn{background:none;border:0;color:var(--red-ink);font-weight:800;font-size:.85rem;cursor:pointer;padding:0;text-decoration:underline}
.shopitem{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center}
.price{display:flex;align-items:center;gap:4px;font-weight:900;color:var(--blue-ink)}
.price svg{width:20px;height:20px}
.smallbtn{width:auto;padding:9px 14px;font-size:.85rem}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal b{font-size:.75rem;color:var(--muted)}
.cd{aspect-ratio:1;max-width:100%;display:grid;place-items:center;border-radius:50%;font-size:.85rem;font-weight:800;color:var(--muted)}
.cd svg{width:60%;height:60%}
.cd.on{background:var(--orange);color:#fff}
.cd.fr{background:var(--blue-soft);color:var(--blue-ink)}
.cd.today{box-shadow:0 0 0 2px var(--ink) inset}
.cd.on.today{box-shadow:0 0 0 3px var(--orange-d) inset}
.kws{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.kw{border-radius:10px;padding:3px 10px;font-weight:800;font-size:.85rem;border:2px solid var(--line)}
.kw.key{background:var(--yellow-soft);border-color:var(--yellow);color:var(--ink)}
.kw.on{background:var(--green-soft);border-color:var(--green);color:var(--green-ink)}
.kw.off{background:var(--red-soft);border-color:var(--red);color:var(--red-ink)}
textarea{width:100%;font:700 1.05rem var(--font);padding:12px 14px;border-radius:16px;border:2px solid var(--line);background:var(--sunk);color:var(--ink);resize:vertical}
.exrow{border:2px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.exrow.ok{border-color:var(--green)} .exrow.mid{border-color:var(--orange)} .exrow.ko{border-color:var(--red)}
.exh{display:flex;justify-content:space-between;gap:8px;align-items:center}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.wk div{display:flex;flex-direction:column;align-items:center;gap:2px}
.wk .cd{width:100%;max-width:44px}
.ord{margin:0;padding-left:1.6em;display:flex;flex-direction:column;gap:8px;min-height:40px}
.ord .ph{color:var(--muted)}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.pool .pc{flex:1 1 140px}
.emo{font-size:1.15em;line-height:1} .wordbig .emo{font-size:1.1em} .pic{display:block;max-width:100%;width:auto;height:auto;object-fit:contain;max-height:210px;margin:0 auto;border-radius:12px;background:#fff;border:2px solid var(--line);align-self:center} .sheet .pic{max-height:120px;margin:0;align-self:flex-start} .ordsol{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:4px}
/* Leçon */
.lesson{min-height:100%;display:flex;flex-direction:column;gap:18px;padding-top:14px}
.lhead{display:flex;align-items:center;gap:12px}
.x{background:none;border:0;color:var(--muted);cursor:pointer;padding:4px;display:grid}
.x svg{width:26px;height:26px}
.lbar{flex:1;height:16px;background:var(--line);border-radius:99px;overflow:hidden}
.lbar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .35s;box-shadow:inset 0 -5px 0 rgba(0,0,0,.08),inset 0 4px 0 rgba(255,255,255,.35)}
.combo{color:var(--orange);font-weight:900;font-size:.95rem;white-space:nowrap}
.kicker{font-weight:900;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;display:inline-flex;align-items:center;gap:6px;color:var(--purple-d)}
.kicker.new{color:var(--purple-d)} .kicker.rev{color:var(--orange-d)}
.prompt{font-size:1.45rem;font-weight:900;line-height:1.2}
.speech{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:end}
.speech .say{position:relative;border:2px solid var(--line);border-radius:16px;padding:14px;font-size:1.08rem}
.speech .say::before{content:"";position:absolute;left:-10px;bottom:22px;width:16px;height:16px;background:var(--bg);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.wordbig{font-size:2.3rem;font-weight:900;line-height:1.05;overflow-wrap:anywhere;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spk{background:var(--blue);color:#fff;border:0;border-bottom:4px solid var(--blue-d);border-radius:14px;width:48px;height:44px;display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
.spk svg{width:26px;height:26px}
.spk-s{display:inline-grid;width:36px;height:32px;border-bottom-width:3px;vertical-align:middle;margin-left:4px}
.spk-s svg{width:20px;height:20px}
.cta{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;align-items:center;border:2px solid var(--line);border-bottom-width:4px;border-radius:18px;padding:12px;margin-bottom:6px}
.cta p b{color:var(--orange-d)}
.streakbox{display:flex;align-items:center;gap:12px;background:var(--orange-soft);border-radius:16px;padding:12px 16px;width:100%;text-align:left}
.streakbox .f{color:var(--orange);width:46px;height:46px;flex:0 0 auto}
.streakbox b{font-size:1.3rem}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.one{grid-template-columns:1fr}
.opt{border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;background:var(--surface);color:var(--ink);font-weight:800;font-size:1.05rem;padding:14px 12px;cursor:pointer;text-align:center;min-height:62px}
.opts.one .opt{text-align:left;font-size:.95rem;font-weight:700}
.opt[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft);color:var(--blue-ink)}
.opt.ok{border-color:var(--green);background:var(--green-soft);color:var(--green-ink)}
.opt.ko{border-color:var(--red);background:var(--red-soft);color:var(--red-ink)}
.opt.done{opacity:.35;cursor:default}
input[type=text]{width:100%;font:800 1.3rem var(--font);padding:14px 16px;border-radius:16px;border:2px solid var(--line);background:var(--sunk);color:var(--ink)}
.hintbtn{align-self:flex-start;background:none;border:0;color:var(--blue-ink);font-weight:900;text-transform:uppercase;font-size:.85rem;letter-spacing:.05em;cursor:pointer;padding:0}
.clair{background:var(--green-soft);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;font-size:.98rem}
.clair b{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--green-ink)}
.gl{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-decoration:underline dotted var(--blue);text-decoration-thickness:2px;text-underline-offset:3px}
.glbox{background:var(--blue-soft);border-radius:12px;padding:8px 12px;font-size:.92rem;margin:0}
.vid{color:var(--blue-ink);font-weight:900;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.vid svg{width:20px;height:20px}
.def{font-size:1.1rem}
.lfoot{margin-top:auto;padding-top:10px}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:8;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));transform:translateY(105%);transition:transform .22s ease}
.sheet.show{transform:none}
.sheet .in{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.sheet.ok{background:var(--green-soft)} .sheet.ko{background:var(--red-soft)}
.sheet h3{font-size:1.4rem;display:flex;align-items:center;gap:10px}
.sheet h3 svg{width:34px;height:34px;flex:0 0 auto}
.sheet.ok h3,.sheet.ok .t{color:var(--green-ink)} .sheet.ko h3,.sheet.ko .t{color:var(--red-ink)}
.sheet .scroll{max-height:34vh;overflow:auto;display:flex;flex-direction:column;gap:8px}
.pairs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:10px}
.pairs .col{display:flex;flex-direction:column;gap:10px}
.pc{border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;background:var(--surface);color:var(--ink);padding:10px;cursor:pointer;font-weight:700;font-size:.85rem;text-align:left;min-height:56px}
.pc.w{font-weight:900;font-size:1rem;text-align:center}
.pc.sel{border-color:var(--blue);background:var(--blue-soft);color:var(--blue-ink)}
.pc.done{border-color:var(--line);color:var(--line);background:var(--surface);cursor:default}
.pc.bad{border-color:var(--red);background:var(--red-soft)}
.endscreen{display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px;padding-top:30px}
.endscreen h1{font-size:2rem;color:var(--yellow-d)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.kpi{border:2px solid var(--c);border-radius:16px;overflow:hidden}
.kpi small{display:block;background:var(--c);color:#fff;font-weight:900;text-transform:uppercase;font-size:.7rem;letter-spacing:.06em;padding:4px}
.kpi b{display:block;padding:10px 4px;font-size:1.3rem;font-weight:900;color:var(--c);font-variant-numeric:tabular-nums}
.timer{font-weight:900;font-size:1.4rem;color:var(--orange);font-variant-numeric:tabular-nums}

/* Toasts et effets */
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translate(-50%,-160%);background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:10px 14px;max-width:min(92vw,420px);z-index:20;transition:transform .35s ease;display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:center}
#toast.show{transform:translate(-50%,0)}
#toast b{display:block;font-weight:900}
#toast span{font-size:.88rem;color:var(--muted)}
#toast .ti{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff}
#toast .ti svg{width:28px;height:28px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:19;width:100%;height:100%}
.pop{animation:pop .35s ease}
@keyframes pop{40%{transform:scale(1.08)}}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.wiggle{animation:wig 2.4s ease-in-out infinite;transform-origin:50% 90%}
@keyframes wig{0%,100%{transform:rotate(0)}10%{transform:rotate(-6deg)}20%{transform:rotate(6deg)}30%{transform:rotate(0)}}
@media (prefers-reduced-motion:reduce){.pop,.shake,.wiggle,.bubble{animation:none}.sheet,#toast{transition:none}}
</style>

</head>

{u:"saveurs",e:"🍬",cat:"saveur",m:"Le sucré",a:["sucre","le sucre","sucree"],d:"Saveur fondamentale. Exemples : le sucre, la carotte, la canne à sucre.",kw:["sucre","carotte/canne"]},
{u:"saveurs",e:"🧂",cat:"saveur",m:"Le salé",a:["sale","le sale","salee"],d:"Saveur fondamentale. Exemples : le sel, les anchois.",kw:["sel","anchois"]},
{u:"saveurs",e:"🍋",cat:"saveur",m:"L'acide",a:["acide","l acide","aigre"],d:"Saveur fondamentale. Exemples : le citron, le vinaigre.",kw:["citron","vinaigre"]},
{u:"saveurs",e:"☕",cat:"saveur",m:"L'amer",a:["amer","l amer","amere"],d:"Saveur fondamentale. Exemples : le cacao pur, le pamplemousse, le café.",kw:["cacao","pamplemousse/café"]},
{u:"saveurs",e:"🍄",cat:"saveur",m:"L'umami",a:["umami","l umami"],d:"Cinquième saveur, placée au centre de la roue des saveurs.",kw:["cinquième/5","centre"],x:"Umami veut dire « savoureux » en japonais : c'est le goût du bouillon, du parmesan, de la tomate mûre."},
{u:"saveurs",e:"🎡",cat:"saveur0",nw:1,m:"Les saveurs mélangées",d:"Sur la roue des saveurs, entre deux saveurs, on trouve des mélanges : sauce chutney (sucré-salé), chocolat noir (sucré-amer), tarte kiwi-citron (entre amer et acide), citron confit (entre acide et salé).",kw:["chutney","chocolat noir","kiwi-citron/kiwi","citron confit"]},
{u:"saveurs",e:"🔬",cat:"saveur0",m:"L'analyse sensorielle",a:["analyse sensorielle"],d:"Pour définir les saveurs, on pratique une analyse sensorielle en laboratoire.",kw:["définir/saveurs","laboratoire"]},
{u:"saveurs",e:"👅",cat:"saveur0",m:"Les papilles gustatives",a:["papilles","papilles gustatives","papille gustative"],d:"Situées sur la langue, elles contiennent des cellules gustatives reliées au nerf gustatif. Leurs récepteurs captent les saveurs : umami, sucré, amer, aigre (acide), salé.",kw:["langue","cellules gustatives/nerf gustatif","récepteurs"]},
// ===== 3. L'eau et ses états =====
{u:"eau1",e:"💧",cat:"eau",m:"L'eau",a:["eau","l eau"],d:"L'eau est un corps incolore, inodore, insipide (sans saveur), liquide à température ambiante. Elle est composée d'oxygène et d'hydrogène = H2O. Elle peut dissoudre des corps et de nombreuses substances solides, liquides ou gazeuses.",kw:["incolore","inodore","insipide/sans saveur","liquide","oxygène/hydrogène/H2O"],x:"Sans couleur, sans odeur, sans goût. H2O = 2 atomes d'hydrogène + 1 d'oxygène."},
{u:"eau1",e:"⚗️",cat:"eau",m:"H2O",a:["h2o","h20"],d:"Formule de l'eau : elle est composée d'oxygène et d'hydrogène.",kw:["oxygène","hydrogène"]},
{u:"eau1",e:"🌍",cat:"eau0",nw:1,m:"L'eau dans la nature",d:"Elle se présente sous différents aspects : à l'état de vapeur dans l'atmosphère ; sous forme liquide sur le sol (cours d'eau, mer…) et dans le sol (eau d'infiltration) ; à l'état solide sous forme de glace (glaciers…).",kw:["vapeur/atmosphère","liquide/cours d'eau/mer","sol/infiltration","solide/glace/glaciers"],x:"Le cycle de l'eau : la mer s'évapore, fait des nuages, il pleut ou il neige, l'eau s'infiltre et retourne à la mer."},
{u:"eau1",e:"🌡️",cat:"eau0",nw:1,m:"Les états de l'eau",d:"Son état varie en fonction de sa température : en dessous de 0 °C, état solide ; entre 0 et 100 °C, état liquide ; au-dessus de 100 °C, état gazeux.",kw:["0","100","solide","liquide","gazeux"]},
{u:"eau1",e:"🧊➡️💧",cat:"etat",m:"La fusion",a:["fusion"],d:"Passage de l'état solide (glace) à l'état liquide. Il faut chauffer.",kw:["solide/glace","liquide","chauffer"],x:"La glace qui fond : fusion."},
{u:"eau1",e:"💧➡️🧊",cat:"etat",m:"La solidification",a:["solidification"],d:"Passage de l'état liquide à l'état solide (glace). Il faut refroidir.",kw:["liquide","solide/glace","refroidir"]},
{u:"eau1",e:"💧➡️♨️",cat:"etat",m:"L'évaporation",a:["evaporation","vaporisation"],d:"Passage de l'état liquide à l'état gazeux (vapeur). Il faut chauffer.",kw:["liquide","gazeux/vapeur","chauffer"]},
{u:"eau1",e:"♨️➡️💧",cat:"etat",m:"La condensation",a:["condensation","liquefaction"],d:"Passage de l'état gazeux (vapeur) à l'état liquide. Il faut refroidir.",kw:["gazeux/vapeur","liquide","refroidir"],x:"La buée sur une vitre froide : la vapeur redevient liquide."},
{u:"eau1",e:"🧊➡️♨️",cat:"etat",m:"La sublimation",a:["sublimation"],d:"Passage direct de l'état solide (glace) à l'état gazeux (vapeur), sans passer par le liquide. Il faut chauffer.",kw:["solide/glace","gazeux/vapeur","chauffer"]},
{u:"eau1",e:"♨️➡️🧊",cat:"etat",m:"La condensation solide",a:["condensation solide","deposition"],d:"Passage direct de l'état gazeux (vapeur) à l'état solide (glace). Il faut refroidir.",kw:["gazeux/vapeur","solide/glace","refroidir"],x:"Le givre dans le congélateur : la vapeur devient directement glace."},
{u:"eau1",e:"🫧",cat:"eau",m:"L'eau pure",a:["eau pure","l eau pure"],d:"Eau qui ne contient aucun corps étranger dans sa composition. Elle est incolore, limpide, inodore et sans saveur. Pour l'obtenir, il faut procéder à la distillation de l'eau ordinaire.",kw:["corps étranger","incolore/limpide/inodore","distillation"]},
{u:"eau1",e:"⚗️",cat:"eau",m:"La distillation",a:["distillation"],d:"Procédé qui permet d'obtenir de l'eau pure à partir de l'eau ordinaire.",kw:["eau pure","ordinaire"]},
// ===== 4. Eau potable et eau dure =====
{u:"eau2",e:"🚰",cat:"eau",m:"L'eau potable",a:["eau potable","potable"],d:"Eau qui peut être employée dans l'alimentation. Elle doit être incolore, inodore, limpide, fraîche ; contenir une proportion juste de substances minérales ; être dépourvue de matières organiques et ne contenir qu'un nombre restreint de microbes.",kw:["alimentation","incolore/inodore/limpide/fraîche","minérales","organiques","microbes"]},
{u:"eau2",e:"🧫",cat:"eau",m:"L'analyse bactériologique",a:["analyse bacteriologique"],d:"Analyse qui permet de rechercher les microbes dans l'eau. En France, l'eau du robinet est l'un des aliments les plus contrôlés : elle fait l'objet d'un suivi sanitaire permanent.",kw:["microbes","robinet/contrôlés","suivi sanitaire"]},
{u:"eau2",e:"🔧",cat:"liste",nw:1,m:"Rendre une eau potable",d:"Filtration ; purification par des agents chimiques (eau de Javel) ; purification par la chaleur (ébullition) ; stérilisation par l'électricité (rayons ultraviolets).",kw:["filtration","javel/chimiques","chaleur/ébullition","ultraviolet/électricité"],x:"4 moyens : filtrer, javelliser, faire bouillir, ou passer aux UV."},
{u:"eau2",e:"📕",cat:"eau0",nw:1,m:"Le code de la santé publique",d:"(Arrêté du 18.08.61 et décret du 3.01.89) L'eau potable ne doit pas porter atteinte à la santé publique ; doit être limpide, sans odeur ni saveur désagréable ; ne pas renfermer plus de 2 g par litre de minéralisation totale, dont 0,1 mg de plomb maximum par litre et moins de 50 mg/l de nitrates ; aucun Escherichia coli dans 100 ml, aucun streptocoque dans 50 ml, aucun germe anaérobie dans 20 ml.",kw:["santé publique","limpide","2 g","plomb/0,1","nitrates/50","Escherichia coli/streptocoque/anaérobie"]},
{u:"eau2",e:"🚿",cat:"eau0",nw:1,m:"L'eau au laboratoire (fiche MT6)",d:"L'eau courante est contrôlée par les services hygiéniques de la commune et doit seule servir aux opérations du laboratoire. Ne pas se servir d'eaux non contrôlées (notamment des eaux de forage non analysées).",kw:["contrôlée/commune","seule","forage"]},
{u:"eau2",e:"☣️",cat:"eau0",nw:1,m:"Le danger de contamination",d:"L'eau non potable est une source importante de contamination par de nombreux parasites et germes pathogènes. Maîtrise : vérifier les critères de potabilité auprès des services d'hygiène de la commune et demander un bulletin d'analyses au moindre doute (odeur anormale…).",kw:["non potable","parasites/germes","potabilité/vérifier","bulletin d'analyses/analyses"]},
{u:"eau2",e:"🥶",cat:"eau0",nw:1,m:"La condensation au laboratoire",d:"L'air ambiant apporte de l'humidité, qui se dépose par condensation sur les parois froides (tuyauteries…) et forme le givre des installations frigorifiques. Maîtrise : limiter la condensation par calorifugeage des tuyauteries ; ne jamais utiliser l'eau de dégivrage, sauf pour le nettoyage des sols.",kw:["condensation","givre","calorifugeage","dégivrage/sols"],x:"Calorifuger = entourer les tuyaux d'un isolant pour éviter qu'ils « transpirent »."},
{u:"eau2",e:"🦠",cat:"eau0",nw:1,m:"Le danger de multiplication",d:"L'eau stagnante est contaminée par l'air, les poussières et les débris alimentaires. À la température du laboratoire, des germes peuvent s'y développer, puis être transportés aux aliments par l'air, des objets ou la main. Maîtrise : ne jamais laisser l'eau stagner (flaques au sol, sous les meubles, dans les enceintes frigorifiques).",kw:["stagnante","germes","stagner/flaques"]},
{u:"eau2",e:"📏",cat:"eau",m:"Le degré hydrotimétrique",a:["degre hydrotimetrique","hydrotimetrique","titre hydrotimetrique"],d:"Il définit la teneur d'une eau en sels minéraux ; il est de 0 pour une eau pure.",kw:["sels minéraux/teneur","0/eau pure"]},
{u:"eau2",e:"🪨",cat:"eau",m:"L'eau dure",a:["eau dure"],d:"Eau qui présente un degré hydrotimétrique de 30. Les eaux dures provoquent des dépôts nuisibles dans les tuyauteries (alimentation des appareils à buée) et les chaudières : il est préférable que le degré soit inférieur à 30.",kw:["30","dépôts","tuyauteries/chaudières/buée"]},
{u:"eau2",e:"⚪",cat:"eau",m:"L'eau calcaire",a:["eau calcaire","calcaire"],d:"Eau qui contient du carbonate de chaux (craie). Le calcaire peut déposer à l'intérieur des canalisations et diminuer l'activité de certains produits de nettoyage ou de désinfection.",kw:["carbonate de chaux/carbonate","craie","canalisations/nettoyage"]},
{u:"eau2",e:"🧱",cat:"eau",m:"L'eau séléniteuse",a:["eau seleniteuse","seleniteuse"],d:"Eau qui contient du sulfate de chaux (plâtre).",kw:["sulfate de chaux/sulfate","plâtre"],x:"Calcaire = craie (carbonate). Séléniteuse = plâtre (sulfate)."},
{u:"eau2",e:"🍞",cat:"eau0",nw:1,m:"La dureté et la panification",d:"Les eaux pures et les eaux trop dures donnent de moins bons résultats en panification que les eaux intermédiaires (degré hydrotimétrique voisin de 30).",kw:["pures/trop dures","panification","30/intermédiaires"]},
// ===== 5. Rôle de l'eau =====
{u:"eau3",e:"⭐",cat:"role",nw:1,m:"La place de l'eau en pâtisserie",d:"L'eau occupe une place majeure : elle sert autant dans les fabrications que pour le nettoyage. Elle peut aussi être à l'origine de problèmes sanitaires (les bactéries ont besoin d'eau pour se développer). Le lait, les œufs, la crème sont des matières premières qui contiennent de l'eau.",kw:["fabrications","nettoyage","bactéries/sanitaires","lait/œufs/crème"]},
{u:"eau3",e:"🍞",cat:"role",nw:1,m:"L'eau en panification",d:"En quantité, l'eau est, après la farine, le plus important élément de la pâte. Dans les pâtes levées, elle fait gonfler les grains d'amidon, assouplit le gluten et donne à la pâte des qualités plastiques ; elle est indispensable pour créer le milieu humide nécessaire (à la fermentation).",kw:["après la farine/farine","amidon","gluten","plastiques","humide"]},
{u:"eau3",e:"🥐",cat:"role",nw:1,m:"L'eau dans la pâte feuilletée",d:"À la cuisson, l'eau de la détrempe se transforme en vapeur. Chaque feuille de pâte est rendue imperméable par la fonte de la matière grasse et retient la vapeur d'eau, qui pousse et décolle chaque feuillet : c'est la montée en « accordéon » qui caractérise le feuilletage.",kw:["détrempe","vapeur","imperméable/matière grasse","feuillet/décolle","accordéon"],x:"La vapeur coincée entre les couches de beurre soulève chaque feuille : le feuilletage monte comme un accordéon."},
{u:"eau3",e:"🥟",cat:"role",nw:1,m:"L'eau dans la pâte à choux",d:"Pâte qui contient beaucoup d'eau (celle de la préparation initiale et celle des œufs). Sous l'influence de la chaleur du four, l'eau se transforme en vapeur (100 °C), qui cherche à s'échapper et provoque le gonflement de la pâte.",kw:["beaucoup d'eau/œufs","vapeur","100","gonflement/gonfler"]},
{u:"eau3",e:"🍮",cat:"role",nw:1,m:"L'eau dans les crèmes et bavaroises",d:"Le lait, la crème, les œufs contiennent beaucoup d'eau : ils constituent l'élément liquide dans lequel les autres ingrédients se diffusent, se dissolvent et s'homogénéisent. Dans une infusion, c'est l'eau qui transporte les arômes.",kw:["lait/crème/œufs","liquide","diffusent/dissolvent/homogénéisent","infusion/arômes"]},
{u:"eau3",e:"🍯",cat:"role",nw:1,m:"L'eau dans les sirops",d:"Son rôle est de première importance : elle permet d'obtenir des sirops de sucre plus ou moins concentrés, indispensables à la réussite des fabrications.",kw:["sirops","concentrés"]},
{u:"eau3",e:"🍨",cat:"role",nw:1,m:"L'eau en glacerie",d:"Son rôle est très important : l'eau constitue le régulateur des glaces et des sorbets, afin d'avoir un bon équilibre dans la formule.",kw:["régulateur","glaces/sorbets","équilibre"]},
{u:"eau3",e:"🧽",cat:"role",nw:1,m:"L'eau pour le nettoyage",d:"L'eau est le premier et le principal agent nettoyant. C'est aussi un support pour les produits de nettoyage.",kw:["premier/principal","agent nettoyant/nettoyant","support"]},
{u:"eau3",e:"🍫",cat:"indes",nw:1,m:"L'eau et le chocolat",d:"Mélangée à la couverture, l'eau la fait épaissir : il faut toujours éviter de mettre ces produits en contact.",kw:["couverture","épaissir","éviter/contact"],x:"Une goutte d'eau dans le chocolat fondu, et il devient pâteux : on dit qu'il « tranche »."},
{u:"eau3",e:"🍪",cat:"indes",m:"Les produits secs",a:["produits secs","produit sec"],d:"Un produit est dit « sec » (sablés, tuiles, cigarettes…) quand son hydratation ne dépasse pas 15 %.",kw:["sablés/tuiles/cigarettes","15"]},
{u:"eau3",e:"🍬",cat:"indes",nw:1,m:"La nougatine et les caramels secs",d:"Dans une atmosphère humide, le sucre est hygroscopique (il absorbe l'eau) : il va se charger de l'humidité ambiante et devenir « poisseux ». Tous ces produits sont à stocker à l'abri de l'humidité.",kw:["hygroscopique/absorbe","humidité","poisseux","abri"]},
{u:"eau3",e:"🦠",cat:"indes",m:"L'eau stagnante",a:["eau stagnante"],d:"Si l'eau est un support pour les matières premières et les produits de nettoyage, elle l'est aussi pour les microbes et les bactéries. Une eau stagnante devient un milieu propice au développement des microbes : il faut toujours veiller à ce que ustensiles et locaux soient propres et secs.",kw:["microbes/bactéries","propice","propres","secs"]},
// ===== 6. Histoire du sel =====
{u:"sel1",e:"🏛️",cat:"histo",m:"Sal",a:["sal"],d:"Origine latine du mot sel.",kw:["latine/latin"]},
{u:"sel1",e:"🔥",cat:"histo0",nw:1,m:"Le premier additif",d:"Tout comme le feu, le sel a révolutionné la vie de nos ancêtres. Il fut certainement le premier additif qui améliora la saveur des produits dont l'homme disposait.",kw:["feu","additif","saveur"]},
{u:"sel1",e:"🦴",cat:"histo0",nw:1,m:"Le sel à la préhistoire",d:"Dès la préhistoire, il sert à conserver les peaux, mais aussi et surtout les aliments.",kw:["conserver","peaux","aliments"]},
{u:"sel1",e:"🍖",cat:"histo",m:"Les Celtes",a:["celtes","les celtes"],d:"Dans l'Antiquité, ils n'ignorent rien des mines de sel ni de la conservation des jambons.",kw:["mines","jambons"]},
{u:"sel1",e:"💰",cat:"histo",m:"Le salaire",a:["salaire"],d:"Mot qui vient du sel : il aurait servi de monnaie, et les soldats romains touchaient une partie de leur solde en sel.",kw:["monnaie","soldats romains/romains","solde"],x:"Sel → salaire : les soldats romains étaient en partie payés en sel !"},
{u:"sel1",e:"⛪",cat:"histo",m:"Les abbayes",a:["abbayes","les abbayes"],d:"Au Moyen Âge, fromages et salaisons font du sel un produit de consommation courante. Les premières exploitations de sel ont été faites par les abbayes, du 9e au 12e siècle.",kw:["Moyen Âge","fromages/salaisons","exploitations","9e/12e"]},
{u:"sel1",e:"👑",cat:"histo",m:"La gabelle",a:["gabelle","la gabelle"],d:"Impôt écrasant et très célèbre sur le sel, institué le 20 mai 1340 par l'État devenu producteur principal ; il fut aboli à la Révolution.",kw:["impôt","1340","Révolution/abolie"]},
{u:"sel1",e:"🏭",cat:"histo",m:"L'industrie de la soude",a:["soude","industrie de la soude"],d:"Au XIXe siècle, elle devient un client majeur des saliniers ; ce débouché remplace peu à peu la consommation alimentaire de sel.",kw:["XIXe/19","saliniers/client"]},
{u:"sel1",e:"🧊",cat:"histo",m:"Le réfrigérateur",a:["refrigerateur","frigo"],d:"Son apparition, à la fin des années 30, fait chuter la consommation alimentaire de sel (on n'a plus besoin de saler pour conserver).",kw:["années 30/30","chuter/consommation"]},
// ===== 7. Origine du sel =====
{u:"sel2",e:"🧂",cat:"sel",m:"Le chlorure de sodium",a:["chlorure de sodium","nacl"],d:"Nom chimique du sel, de formule NaCl. À l'état pur, le sel se présente sous forme de petits cristaux prismatiques incolores, inodores, durs et solides ; il est très soluble dans l'eau.",kw:["NaCl","cristaux","incolores/inodores","soluble"]},
{u:"sel2",e:"⚖️",cat:"sel0",nw:1,m:"Le sel et le sodium",d:"Le sel ajouté aux aliments contient 40 % de sodium (1 g de sel apporte 400 mg de sodium). Quand on parle des effets du sel sur la santé, il s'agit en fait des effets du sodium.",kw:["40","400","santé/sodium"]},
{u:"sel2",e:"🌊",cat:"sel",m:"Le sel marin",a:["sel marin","marin"],d:"Sel issu de l'eau de mer (environ 27 g par litre), dans les marais salants du littoral atlantique et les salins méditerranéens. Il représente 43 % de la production française.",kw:["mer","27","marais salants/salins","43"],x:"Le sel de la mer : c'est le plus produit en France."},
{u:"sel2",e:"🔲",cat:"sel",m:"Les œillets",a:["oeillets","les oeillets","oeillet"],d:"Bassins terminaux des marais salants (30 à 75 m²) où le sel se dépose. L'eau de mer y arrive grâce aux marées et par pompage ; le sel est ensuite lavé, ramassé et stocké en tas de 20 m de haut pour sécher.",kw:["bassins","30/75","sel se dépose/dépose","20 m/tas"]},
{u:"sel2",e:"📍",cat:"sel0",nw:1,m:"Les marais salants en France",d:"En Camargue (Aigues-Mortes), en Charente et dans la région du Croisic (sel de Guérande).",kw:["Camargue/Aigues-Mortes","Charente","Croisic/Guérande"]},
{u:"sel2",e:"🌸",cat:"sel",m:"La fleur de sel",a:["fleur de sel"],d:"Produit rare, très recherché pour ses cristaux friables et sa richesse en magnésium et oligo-éléments. Elle se forme à la surface des marais salants en une délicate pellicule, les jours de très beau temps sec. Ses cristaux sont très fins (évaporation très rapide) et très blancs (jamais en contact avec le fond des bassins).",kw:["rare","friables","magnésium/oligo-éléments","surface/pellicule","fins/blancs"]},
{u:"sel2",e:"⛏️",cat:"sel",m:"Le sel gemme",a:["sel gemme","gemme"],d:"Sel sous forme de roche à l'intérieur de la terre, extrait des mines qui exploitent les gisements (explosifs ou moyens mécaniques et pneumatiques), puis expédié brut ou après concassage, broyage, tamisage. Il représente 17 % de la production française.",kw:["roche","mines/gisements","concassage/broyage/tamisage","17"],x:"Gemme = pierre précieuse : le sel gemme est une roche qu'on extrait de la mine."},
{u:"sel2",e:"🔥",cat:"sel",m:"Le sel ignigène",a:["sel ignigene","ignigene"],d:"Obtenu en envoyant de l'eau douce dans les gisements de sel gemme : on remonte une saumure, évaporée dans une machine appelée saline. Il représente 40 % de la production française.",kw:["eau douce","saumure","saline","40"],x:"Igni = feu : on fait évaporer l'eau salée en la chauffant."},
{u:"sel2",e:"🏭",cat:"sel",m:"La saline",a:["saline"],d:"Machine dans laquelle on évapore la saumure pour obtenir le sel ignigène.",kw:["saumure","évapore","ignigène"]},
// ===== 8. Rôles et choix du sel =====
{u:"sel3",e:"🫀",cat:"rolesel",nw:1,m:"Le rôle du sel dans l'alimentation",d:"(Partie grisée vierge, complétée à vérifier avec le formateur.) Le sel est indispensable à l'organisme (il aide à garder l'équilibre en eau du corps) ; il relève la saveur des aliments ; il sert à conserver les aliments (salaisons).",kw:["organisme/indispensable","saveur","conserver/conservation"]},
{u:"sel3",e:"🧁",cat:"rolesel",nw:1,m:"Le rôle du sel en pâtisserie",d:"(Partie grisée vierge, complétée d'après les objectifs du cours, à vérifier.) Saveur : il relève le goût. Fermentation : il régule (ralentit) l'action de la levure. Élasticité : il resserre le gluten et donne du corps à la pâte. Coloration : il favorise la coloration de la croûte. Conservation : il aide à garder l'humidité et à conserver.",kw:["saveur/goût","fermentation/levure","élasticité/gluten/corps","coloration","conservation"],x:"5 rôles à retenir : saveur, fermentation, élasticité, coloration, conservation."},
{u:"sel3",e:"🧂",cat:"choix",m:"Le sel de table iodé raffiné",a:["sel de table","sel iode","sel de table iode raffine","sel raffine"],d:"Sel classique qui sert seulement à aromatiser les plats et l'eau de cuisson ; aucune particularité ni bienfait. Déconseillé aux personnes hypertendues : le raffinage lui enlève toutes ses propriétés de santé.",kw:["aromatiser","raffinage/raffiné","hypertension/hypertendues"]},
{u:"sel3",e:"🏖️",cat:"choix",m:"Le sel de Guérande",a:["guerande","sel de guerande"],d:"Plus riche en magnésium que le sel de table classique ; le sel fin de Guérande peut aromatiser toutes sortes de plats.",kw:["magnésium","toutes sortes/plats"]},
{u:"sel3",e:"🪨",cat:"choix",m:"Le gros sel",a:["gros sel","gros-sel"],d:"Sel aux cristaux grossiers à l'énorme pouvoir salant. Pas pour aromatiser une sauce, mais parfait pour l'eau de cuisson des pâtes, le pot-au-feu, le court-bouillon ou une cuisson en croûte de sel. Assez riche en magnésium et oligo-éléments s'il est de bonne qualité.",kw:["cristaux grossiers/grossiers","pouvoir salant","cuisson/pot-au-feu/court-bouillon/croûte"]},
{u:"sel3",e:"🌸",cat:"choix0",nw:1,m:"La fleur de sel en cuisine",d:"Plus fine et parfumée, résultat d'une récolte minutieuse à l'écumoire à la surface des marais salins. Préférée des chefs étoilés, elle parfume un plat après cuisson : ni à cuire, ni dans un moulin !",kw:["fine/parfumée","écumoire","après cuisson","moulin"]},
{u:"sel3",e:"🩶",cat:"choix",m:"Le sel marin gris non raffiné",a:["sel gris","sel marin gris"],d:"Sel dont les nutriments ont été préservés : meilleur pour la santé, et mieux assimilé par l'organisme.",kw:["nutriments","santé","assimile"]},
{u:"sel3",e:"🩷",cat:"choix",m:"Le sel rose de l'Himalaya",a:["sel rose","himalaya","sel rose de l himalaya"],d:"La « Rolls-Royce » des sels, le seul qui ne vient pas de la mer mais des pays qui bordent l'Himalaya. Sans iode, mais près d'une centaine de nutriments. Cristaux roses épais pour moulin. Faible teneur en sodium : idéal pour les hypertendus.",kw:["Rolls-Royce","pas de la mer/Himalaya","iode","nutriments","sodium/hypertendus"]},
{u:"sel3",e:"🇯🇵",cat:"choix",m:"Le Gomasio",a:["gomasio"],d:"D'origine japonaise : graines de sésame torréfiées et partiellement moulues, mélangées à 5 % de sel de mer. Recommandé pour réduire le sodium, très riche en calcium, il ne se cuit pas : il aromatise les plats après cuisson.",kw:["japonaise","sésame","5","calcium","après cuisson/cuit"]},
{u:"sel3",e:"🌿",cat:"choix",m:"Les sels aromatiques",a:["sels aromatiques","sel aromatique"],d:"Sel de mer fin mélangé à des herbes ou épices (curcuma, piments, gingembre, algues, herbes de Provence, légumes séchés) : une bonne façon de consommer moins de sel.",kw:["herbes/épices","moins de sel"]},
{u:"sel3",e:"🌋",cat:"choix",m:"Le sel noir de Hawaï",a:["sel noir","hawai","sel noir de hawai"],d:"Récolté sur les pentes volcaniques de Hawaï et des régions volcaniques de l'hémisphère sud. Très aromatique, à doser soigneusement. Sa couleur vient du charbon actif dont il est enrobé ; il purifierait l'organisme.",kw:["volcaniques","aromatique/doser","charbon actif"]},
{u:"sel3",e:"🔵",cat:"choix",m:"Le sel bleu",a:["sel bleu"],d:"Sel des mines d'Iran et du Pakistan, mêlé de petits cristaux bleus. Il aromatise surtout les plats de poisson ou les salades, à cause de sa note citronnée.",kw:["Iran/Pakistan","poisson/salades","citronnée"]},

function norm(s){return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z ]/g,"").replace(/\s+/g," ").trim()}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

const GKEYS=Object.keys(GLOSS).sort((a,b)=>b.length-a.length);
const GRX=new RegExp("(^|[^a-zà-ÿ-])("+GKEYS.map(k=>k.replace(/[-]/g,"\\-")).join("|")+")(?=$|[^a-zà-ÿ-])","gi");
// définition avec les mots difficiles soulignés ; on n'explique jamais un mot qui donnerait la réponse
function rich(d,w){
  const stem=w?norm(w.m).slice(0,5):"~";
  return esc(d).replace(GRX,(all,pre,t)=>{const k=t.toLowerCase();
    if(!GLOSS[k]||norm(k).startsWith(stem))return all;
    return `${pre}<button type="button" class="gl" data-gl="${esc(k)}">${t}</button>`});
}
function clair(w){return EXPL[w.m]?`<div class="clair"><b>${w.e||""} En clair</b><span>${esc(EXPL[w.m])}</span></div>`:""}
document.addEventListener("click",e=>{
  const b=e.target.closest(".gl");if(!b)return;e.stopPropagation();
  const host=b.closest(".def,dd,.hint")||b.parentElement;
  let box=host.nextElementSibling&&host.nextElementSibling.classList.contains("glbox")?host.nextElementSibling:null;
  if(!box){box=document.createElement("p");box.className="glbox";host.after(box)}
  if(box.dataset.k===b.dataset.gl){box.remove();return}
  box.dataset.k=b.dataset.gl;box.innerHTML=`<b>${esc(b.textContent)}</b> : ${esc(GLOSS[b.dataset.gl])}`;
},true);

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function dayNum(d=new Date()){return Math.floor((d.getTime()-d.getTimezoneOffset()*6e4)/864e5)}
const TODAY=()=>dayNum();
function lev(a,b){const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);for(let j=1;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}

let combo=0;
function answer(w,q){
  const c=card(w),t=TODAY(),wasDue=c.due<=t||c.b===0,pg=gradeOf(masteredCount()),wasM=c.b>=4;
  c.n++;S.days[t]=(S.days[t]||0)+1;const goalBefore=(S.days[t]-1)>=GOAL;
  let xp=0;
  if(q===2){c.ok++;combo++;S.best.combo=Math.max(S.best.combo,combo);
    if(wasDue){const was5=c.b===5;c.b=Math.min(5,c.b+1);c.due=t+(was5?21:INT[c.b])}xp=10+Math.min(combo,10);bump("ok");bump("combo",combo,true)}
  else if(q===1){combo=0;c.b=Math.max(1,Math.min(c.b,3));c.due=t+(c.b>=2?1:0);xp=5}
  else{combo=0;c.b=c.b>=4?2:1;c.due=t;xp=2}
  if(boost())xp*=2;
  S.bestStreak=Math.max(S.bestStreak||0,streak());
  S.xp+=xp;bump("xp",xp);
  if(!wasM&&c.b>=4)toast("Repère maîtrisé !",`${w.m} · ${masteredCount()} / ${N}`,"var(--green)",IC.star,false);
  if(wasM&&c.b<4)toast("À consolider : "+w.m,"Il revient dans tes révisions, pas de panique.","var(--orange)",IC.bolt,false);
  if(!goalBefore&&S.days[t]>=GOAL)toast("Objectif du jour atteint !","Tu peux viser le super objectif : 60 réponses !","var(--green)",IC.target,true);
  if(S.days[t]===GOAL2){S.gems+=15;toast("Super objectif atteint !","60 réponses aujourd'hui · +15 gemmes","var(--purple)",IC.crown,true)}
  S.mh=S.mh||{};S.mh[t]=masteredCount();
  checkRewards(pg);save();return xp;
}

/* ---------- Construction d'une leçon ---------- */
function reviewWords(exclude,n){
  const t=TODAY();const pool=W.filter(w=>seen(w)&&!exclude.includes(w));
  const due=shuffle(pool.filter(w=>card(w).due<=t)).sort((a,b)=>B(a)-B(b));
  const rest=shuffle(pool.filter(w=>card(w).due>t));
  return [...due,...rest].slice(0,n);
}
function lessonSteps(node){
  const ws=node.words,steps=[];
  if(node.type==="lesson"){
    // Chaque nouveau repère : présentation, puis UNE question un peu plus tard (pas juste après)
    const news=shuffle(ws.filter(w=>!seen(w))),olds=shuffle(ws.filter(seen));
    news.forEach((w,i)=>{steps.push({t:"intro",w});if(i>=1)steps.push({t:"auto",w:news[i-1]})});
    const tail=[];
    if(news.length)tail.push({t:"auto",w:news[news.length-1]});
    olds.forEach(w=>tail.push({t:"auto",w}));
    reviewWords(ws,3).forEach(w=>tail.push({t:"auto",w,rev:true}));
    steps.push(...shuffle(tail));
    if(ws.length>=3)steps.push({t:"pairs",ws:shuffle(ws).slice(0,5)});
    {const ud=UNITDEF.find(u=>ws[0]&&u.k===ws[0].l);if(ud&&ud.ord)steps.push({t:"order",kind:ud.ord});}
  }else{
    const pool=shuffle(ws).sort((a,b)=>B(a)-B(b));const sel=pool.slice(0,node.n||12);
    sel.forEach(w=>steps.push({t:seen(w)?"auto":"intro",w}));
    steps.splice(4,0,{t:"pairs",ws:shuffle(sel).slice(0,5)});
    if(node.unit===UNITS.length-1)Object.keys(ORDERS).forEach(k=>steps.push({t:"order",kind:k}));
    else{const ud=UNITDEF.find(u=>u.k===ws[0].l);if(ud&&ud.ord)steps.push({t:"order",kind:ud.ord});}
  }
  return steps;
}
function typeFor(step,run){
  let r=typeFor0(step,run);
return (r==="write"&&step.w&&step.w.nw)?"defWrite":r;}
function typeFor0(step,run){
  if(step.t!=="auto")return step.t;
  const w=step.w,b=B(w),hits=run.hits[w.m]||0;
  if(b<=1)return hits?pick(["qcm","flash"]):pick(["qcm","qcmInv"]);
  if(b===2)return pick(["qcm","qcmInv","flash","defWrite"]);
  if(b===3)return pick(["write","defWrite","flash","qcm"]);
  return pick(["write","defWrite","defWrite","flash"]);
}

function kn(s){return String(s).toLowerCase().replace(/œ/g,"oe").replace(/æ/g,"ae").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g," ").trim()}
function stemOf(w){const b=kn(w).replace(/s$/,"");if(b.includes(" "))return b;return b.length>5?b.slice(0,Math.max(5,b.length-2)):b}
function kwHit(alt,text,toks){const st=stemOf(alt);if(!st)return false;if(st.includes(" "))return (" "+text+" ").includes(" "+st);
  return toks.some(t=>t.startsWith(st)||(st.length>=5&&t.length>=st.length&&lev(t.slice(0,st.length),st)<=1))}
function kwCheck(w,answer){const text=kn(answer),toks=text.split(" ").filter(Boolean);
  return (KW[w.m]||[]).map(k=>{const alts=k.split("/");return{label:alts[0],ok:alts.some(a=>kwHit(a,text,toks))}})}
function kwChips(w,cls="key"){const k=KW[w.m]||[];return k.length?`<div class="kws"><span class="small muted" style="font-weight:800">Mots-clés :</span>${k.map(x=>`<span class="kw ${cls}">${esc(x.split("/")[0])}</span>`).join("")}</div>`:""}

    setTimeout(()=>say(w.d),250);
    showSheet(q>0,`<p class="t">${f} mot${f>1?"s":""}-clé${f>1?"s":""} sur ${n}${q===2?` · +${gain} XP`:q===1?" : ajoute ceux qui manquent la prochaine fois":""}</p><div class="kws">${chips}</div><p class="small" style="margin-top:4px"><b>Ce que dit le cours :</b></p><p class="def">${rich(w.d,null)}</p>${clair(w)}`,advance,"Continuer",q===1?"Presque !":null)};

/* ---------- Examen blanc ---------- */
function startExam(full){
  const seenW=W.filter(seen);
  const pool=full?W:seenW;
  if(!full&&seenW.length<8){toast("Pas encore assez de repères","Fais quelques leçons, ou choisis l'examen complet.","var(--blue)",IC.star);return}
  const sel=shuffle(pool).slice(0,20),h=Math.ceil(sel.length/2);
  const steps=shuffle(sel.map((w,i)=>({t:(i<h||w.nw)?"defWrite":"write",w})));
  startRun(steps,{exam:true,full,results:[]});
}
function examRecord(s,q,pts,info){
  answer(s.w,q);run.results.push({w:s.w,pts,...info});run.n++;if(pts>=1)run.ok++;
  run.i++;nextStep();
}
function examEnd(r){
  const n=r.results.length||1,tot=r.results.reduce((a,x)=>a+x.pts,0);
  const note=Math.round(tot/n*20*2)/2;
  S.exams=S.exams||[];S.exams.push({d:TODAY(),s:note,full:!!r.full});save();checkRewards(gradeOf(masteredCount()));
  const secs=Math.round((Date.now()-r.t0)/1000);
  const msg=note>=16?"Prêt pour le jour J !":note>=12?"Bien ! Encore quelques repères à consolider.":note>=8?"Ça progresse, continue tes révisions.":"Pas de panique, c'est un entraînement : les repères ratés vont revenir.";
  sfx(note>=12?"done":"tap");if(note>=14)confetti();
  setTimeout(()=>say(`${String(note).replace(".",",")} sur 20. ${msg}`),500);
  const best=Math.max(...S.exams.map(e=>e.s));
  const rows=r.results.map(x=>{const ok=x.pts>=1,part=x.pts>0&&x.pts<1;
    const pts=String(x.pts).replace(".",",");
    return `<div class="exrow ${ok?"ok":part?"mid":"ko"}"><div class="exh"><b>${esc(x.w.m)}</b><span class="pill ${ok?"p4":part?"p2":"p1"}">${pts} pt</span></div>
     ${x.type==="def"?`<div class="kws">${x.res.map(k=>`<span class="kw ${k.ok?"on":"off"}">${k.ok?"✓":"✗"} ${esc(k.label)}</span>`).join("")}</div>`:`<p class="small">${x.txt?`Ta réponse : <b>${esc(x.txt)}</b>`:"Pas de réponse"}${ok?"":` · bonne réponse : <b>${esc(x.w.m)}</b>`}</p>`}
     ${ok?"":`<p class="small muted">${esc(x.w.d)}</p>`}</div>`}).join("");
  app.innerHTML=`<section class="endscreen">${mascot(note>=12?"wow":"happy",120)}<h1>${String(note).replace(".",",")} / 20</h1><p>${msg}</p>
   <div class="kpis"><div class="kpi" style="--c:var(--green)"><small>Réussis</small><b>${r.results.filter(x=>x.pts>=1).length}/${n}</b></div><div class="kpi" style="--c:var(--purple)"><small>Meilleure note</small><b>${String(best).replace(".",",")}</b></div><div class="kpi" style="--c:var(--blue)"><small>Temps</small><b>${Math.floor(secs/60)}:${String(secs%60).padStart(2,"0")}</b></div></div>
   <div style="width:100%;text-align:left;display:flex;flex-direction:column;gap:8px"><h2>Correction</h2>${rows}</div>
   <button class="b3" id="go">Terminer</button></section>`;
  document.getElementById("go").onclick=()=>{window._scrolled=0;render()};
}

/* ---------- Bilan pour maman ---------- */
function weekStats(){
  const t=TODAY(),days=[];for(let d=t-6;d<=t;d++)days.push({d,n:S.days[d]||0});
  const played=days.filter(x=>x.n>0).length,answers=days.reduce((a,x)=>a+x.n,0);
  const mh=S.mh||{};const before=Object.keys(mh).map(Number).filter(d=>d<t-6).sort((a,b)=>b-a)[0];
  const gained=masteredCount()-(before!==undefined?mh[before]:0);
  const hard=W.filter(seen).map(w=>({w,e:card(w).n-card(w).ok})).filter(x=>x.e>0).sort((a,b)=>b.e-a.e||B(a.w)-B(b.w)).slice(0,6).map(x=>x.w);
  const ex=(S.exams||[]).slice(-1)[0],best=(S.exams||[]).length?Math.max(...S.exams.map(e=>e.s)):null;
  return{days,played,answers,gained,hard,ex,best};
}

/* ---------- Moteur de leçon ---------- */
let run=null,timers=[];
function stopTimers(){timers.forEach(clearInterval);timers=[]}
function startNode(node){startRun(lessonSteps(node),{node,title:node.type==="review"?"Révision":"Leçon"})}
function startRun(steps,opt={}){
  combo=0;run={steps,i:0,total:steps.length,mist:0,ok:0,n:0,xp:0,t0:Date.now(),hits:{},...opt};
  nav.hidden=true;window.scrollTo(0,0);nextStep();
}
function lhead(){const p=run.i/run.total;
  return `<div class="lhead"><button class="x" id="quit" aria-label="Quitter">${IC.x}</button><div class="lbar"><i style="width:${p*100}%"></i></div>${combo>=3?`<span class="combo">${IC.fire.replace('<svg','<svg width="18" height="18" style="vertical-align:-3px"')} ${combo}</span>`:""}</div>`}
function bindQuit(){document.getElementById("quit").onclick=()=>{stopTimers();hideSheet();run=null;render()}}
function nextStep(){
  hideSheet();closeKeyboard();
  if(run.i>=run.steps.length)return finishRun();
  const s=run.steps[run.i];const t=typeFor(s,run);
  ({intro:sIntro,qcm:sQcm,qcmInv:sQcmInv,write:sWrite,pairs:sPairs,flash:sFlash,defWrite:sDefWrite,order:sOrder,photo:sPhoto})[t](s);
  window.scrollTo(0,0);
}
function advance(){run.i++;nextStep()}
function requeue(s){const back={...s,t:s.t==="intro"?"qcm":s.t};run.steps.push(back);run.total=run.steps.length}
function record(s,q){
  const gain=answer(s.w,q);run.xp+=gain;run.n++;
  if(q===2){run.ok++;run.hits[s.w.m]=(run.hits[s.w.m]||0)+1}else{run.mist++;run.req=run.req||{};if(!run.req[s.w.m]){run.req[s.w.m]=1;requeue(s)}}
  return gain;
}

function distractors(w,n=3){
  const fam=(famOf[w.m]||[]).flatMap(fi=>FAMS[fi].w).filter(m=>m!==w.m&&byM[m]);
  const same=W.filter(x=>x.m!==w.m&&x.cat===w.cat).map(x=>x.m);
  const near=[...new Set(w.cat==="date"?same:[...shuffle(fam).slice(0,2),...same])];
  const others=shuffle(W.filter(x=>x.m!==w.m&&x.cat!=="date"&&w.cat!=="date"||(x.m!==w.m&&x.cat===w.cat))).map(x=>x.m);
  return [...new Set([...shuffle(near),...others])].slice(0,n);
}
function choose(s,opts,correct,prompt,one){
  let sel=null;
  app.innerHTML=`<section class="lesson">${lhead()}${kick(s,"Choisis la bonne réponse")}${prompt}
   <div class="opts ${one?"one":""}">${opts.map((o,i)=>`<button class="opt" data-i="${i}" aria-pressed="false">${one?esc(o.label):esc(o.label)}</button>`).join("")}</div>
   <div class="lfoot"><button class="b3" id="chk" disabled>Vérifier</button></div></section>`;
  bindQuit();
  const chk=document.getElementById("chk");
  app.querySelector(".opts").onclick=e=>{const b=e.target.closest(".opt");if(!b||chk.dataset.done)return;sfx("tap");
    app.querySelectorAll(".opt").forEach(x=>x.setAttribute("aria-pressed","false"));b.setAttribute("aria-pressed","true");sel=+b.dataset.i;chk.disabled=false};
  chk.onclick=()=>{if(sel===null||chk.dataset.done)return;chk.dataset.done=1;
    const ok=opts[sel].m===correct;const btns=app.querySelectorAll(".opt");
    btns.forEach((x,i)=>{if(opts[i].m===correct)x.classList.add("ok")});if(!ok){btns[sel].classList.add("ko","shake")}
    const gain=record(s,ok?2:0);
    const wrong=!ok?`<p class="small">Tu as choisi <b>${esc(opts[sel].m)}</b> : ${esc(EXPL[opts[sel].m]||byM[opts[sel].m].d)}</p>`:"";
    showSheet(ok,feedback(s.w,ok,(ok?`<p class="t">+${gain} XP${combo>=3?` · série de ${combo} !`:""}</p>`:"")+wrong),advance)};
}

function circular(n){const s=W.filter(seen);const base=s.length>=6?s:W;const weak=shuffle(base.filter(w=>!isMastered(w))),strong=shuffle(base.filter(isMastered));
  const out=[];while(out.length<n&&(weak.length||strong.length)){if(weak.length)out.push(weak.shift());if(strong.length&&out.length<n)out.push(strong.shift())}return shuffle(out)}

  bindTop();
  document.getElementById("buyF").onclick=()=>{if(S.gems<30||S.freezes>=2)return;S.gems-=30;S.freezes++;save();sfx("quest");toast("Gel de série acheté","Ta série est protégée.","var(--blue)",IC.ice);rQuests()};
  document.getElementById("buyB").onclick=()=>{if(S.gems<40||boost())return;S.gems-=40;S.boostUntil=Date.now()+15*60000;save();sfx("level");toast("Double XP activé !","15 minutes pour tout donner.","var(--purple)",IC.bolt,true);rQuests()};
}

/* ---------- Pièges ---------- */
function rFam(){
  app.innerHTML=topbar()+`<div class="speech" style="margin-bottom:14px"><div>${mascot("happy",86)}</div><div class="say">Ces repères se ressemblent : c'est là qu'on se trompe le jour J. Lis l'astuce, puis touche « Cacher » et récite chaque définition.</div></div>`+
  FAMS.map((f,i)=>`<section class="panel fam" id="f${i}"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2>${esc(f.t)}</h2><button class="chip" data-hide="${i}" aria-pressed="false">Cacher</button></div><p class="tip">${esc(f.tip)}</p><dl>${f.w.map(m=>`<dt>${em(byM[m])}${esc(m)} ${spk(m).replace('class="spk"','class="spk" style="width:34px;height:30px;display:inline-grid;vertical-align:middle;border-bottom-width:3px"')}</dt><dd>${rich(byM[m].d,null)}${clair(byM[m])}</dd>`).join("")}</dl></section>`).join("");
  bindTop();
  app.onclick=e=>{if(tab!=="fam")return;const b=e.target.closest("[data-hide]");if(b){const s=document.getElementById("f"+b.dataset.hide);b.setAttribute("aria-pressed",s.classList.toggle("hide"));return}
    const dd=e.target.closest(".fam.hide dd");if(dd){dd.style.color="var(--muted)";dd.style.background="none";dd.querySelectorAll("*").forEach(x=>x.style.visibility="visible")}};
}

/* ---------- Profil ---------- */
const WEEKS=[["25 oct","Unités 1 et 2 · Les sens, les saveurs"],["26 oct","Unité 3 · L'eau et ses états"],["27 oct","Unité 4 · Eau potable et eau dure"],["28 oct","Unité 5 · Rôle de l'eau"],["29 oct","Unités 6 et 7 · Histoire et origine du sel"],["30 oct","Unité 8 · Quel sel choisir"],["31 oct","Unités 9 et 10 · Termes techniques, chiffres"],["1er nov","Grand final"],["2 nov","Examen blanc"]];
function rProfile(){
  const k=masteredCount(),g=gradeOf(k),t=TODAY(),next=GRADES[g+1];
  const starts=[[9,25],[9,26],[9,27],[9,28],[9,29],[9,30],[9,31],[10,1],[10,2]];let now=-1;const d=new Date();starts.forEach(([mo,dd],i)=>{if(d>=new Date(2026,mo,dd))now=i});
  const nextLabel=w=>{const c=S.cards[w.m];if(!c||!c.n)return"pas encore vu";const x=c.due-t;return x<=0?"à revoir aujourd'hui":x===1?"revient demain":`revient dans ${x} j`};
  app.innerHTML=topbar()+`
   <section class="panel" style="align-items:center;text-align:center">${mascot(k>=40?"wow":"happy",110)}
    <p class="kicker" style="color:var(--purple-d)">${esc(GRADES[g].n)}</p><p class="big" style="color:var(--green-ink)">${k}<span class="muted" style="font-size:1.3rem"> / ${N}</span></p><p>repères maîtrisés</p>
    <div class="qbar" style="width:100%"><i style="width:${k/N*100}%;background:var(--green)"></i></div>
    <p class="small muted">${next?`Encore ${next.at-k} repère${next.at-k>1?"s":""} pour devenir ${esc(next.n)}.`:"Grade maximum. Continue les révisions pour tout garder."}</p>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%"><button class="b3 orange smallbtn" id="toBilan" style="width:100%">Bilan pour maman</button><button class="b3 blue smallbtn" id="toBackup" style="width:100%">Sauvegarde</button></div>
    ${!S.lastBackup||TODAY()-S.lastBackup>=7?`<p class="small" style="color:var(--orange-d);font-weight:800">${S.lastBackup?"Dernière sauvegarde il y a "+(TODAY()-S.lastBackup)+" jours.":"Pas encore de sauvegarde."} Pense à en faire une !</p>`:""}</section>
   <section class="panel"><h2>Grades</h2><div class="ladder">${GRADES.map((x,i)=>`<div class="rung ${i<g?"on":i===g?"cur":""}"><i>${i+1}</i><span><b>${esc(x.n)}</b><br><small class="muted">${esc(x.d)}</small></span><small>${x.at} repères</small></div>`).join("")}</div></section>
   <section class="panel"><h2>Badges · ${Object.keys(S.badges).filter(id=>BADGES.some(b=>b[0]===id)).length}/${BADGES.length}</h2><div class="badges">${BADGES.map(([id,n,dsc,ic,c])=>`<div class="bd ${S.badges[id]?"on":""}" style="--c:var(${c})"><span class="medal">${S.badges[id]?ic:IC.lock}</span><b>${esc(n)}</b><small>${esc(dsc)}</small></div>`).join("")}</div>
    <p class="small muted">${totalDays()} jours de connexion · série actuelle ${streak()} j · Meilleure série de réponses : ${S.best.combo} · Record Chrono : ${S.best.chrono} · ${S.xp} XP</p></section>
   <section class="panel"><h2>Thèmes</h2><div class="letters">${LETTERS.map(l=>{const ws=W.filter(w=>w.l===l),m=ws.filter(isMastered).length;return `<div class="lt ${m===ws.length?"full":""}"><div class="f" style="height:${m/ws.length*100}%"></div><b>${LNAME[l]}</b><small>${m}/${ws.length}</small></div>`}).join("")}</div></section>
   <section class="panel"><h2>Plan jusqu'à la rentrée</h2>${WEEKS.map((w,i)=>`<div class="week ${i===now?"now":""}"><span class="d">${w[0]}</span><span>${w[1]}${i===now?' <span class="pill p4">cette semaine</span>':""}</span></div>`).join("")}</section>
   <section class="panel"><h2>Pourquoi ça marche</h2><ol>
    <li><b>On se teste au lieu de relire.</b> Chercher la réponse, même en se trompant, fait retenir bien plus.</li>
    <li><b>Les mots reviennent au bon moment.</b> Raté : il revient dans la leçon. Su : demain, puis 3, 7, 14, 21 jours. Même maîtrisé, un repère revient.</li>
    <li><b>De plus en plus dur.</b> D'abord choisir parmi 3 ou 4 réponses, puis retrouver la réponse de tête (cartes mémoire), puis écrire le repère sans aide.</li>
    <li><b>On produit la réponse.</b> Expliquer avec ses mots-clés, c'est l'entraînement le plus proche du contrôle.</li>
    <li><b>On mélange.</b> Chaque leçon glisse d'anciens repères, et les fausses réponses sont des mots qui se ressemblent.</li>
    <li><b>Un peu chaque jour.</b> 10 à 15 minutes. La série et les quêtes sont là pour ça.</li></ol></section>
   <section class="panel"><h2>Tous les repères</h2><div class="wl">${W.slice().sort((a,b)=>B(a)-B(b)||a.m.localeCompare(b.m)).map(w=>`<div class="wi"><span><b>${em(w)}${esc(w.m)}</b><br><small>${nextLabel(w)}</small></span><span class="pill p${B(w)}">${STATE[B(w)]}</span></div>`).join("")}</div></section>
   <section class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><b>Voix (lecture des mots)</b><button class="chip" id="voi" aria-pressed="${S.voice!==false}">${S.voice!==false?"Activée":"Coupée"}</button></div>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><b>Sons</b><button class="chip" id="snd" aria-pressed="${S.sound}">${S.sound?"Activés":"Coupés"}</button></div>
    <p class="small muted">La progression est enregistrée sur ce téléphone. <button class="linkbtn" id="rst">Tout remettre à zéro</button></p></section>`;
  bindTop();
  document.getElementById("toBilan").onclick=()=>{tab="bilan";render()};
  document.getElementById("toBackup").onclick=()=>{tab="backup";render()};
  document.getElementById("voi").onclick=()=>{S.voice=S.voice===false;save();rProfile()};
  document.getElementById("snd").onclick=()=>{S.sound=!S.sound;save();rProfile()};
  document.getElementById("rst").onclick=function(){if(this.dataset.c){S=JSON.parse(JSON.stringify(DEF));save();rProfile()}else{this.dataset.c=1;this.textContent="Sûr ? Touche encore pour tout effacer"}};
}

applyFreeze();render();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>

</body>
</html>
